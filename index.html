<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>Lapinnevan Eränkävijät</title>

<style>
body{
font-family: Arial;
background:#f2f2f2;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:white;
padding:40px;
border-radius:12px;
text-align:center;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.pin{
display:flex;
gap:10px;
justify-content:center;
margin-top:20px;
}

.pin input{
width:60px;
height:70px;
font-size:30px;
text-align:center;
}

button{
margin-top:20px;
padding:10px 25px;
font-size:16px;
}

.error{
color:red;
margin-top:10px;
}
</style>
</head>

<body>

<div class="box">

<h2>Lapinnevan Eränkävijät ry</h2>
<p>Salasana</p>

<div class="pin">
<input maxlength="1" id="d1">
<input maxlength="1" id="d2">
<input maxlength="1" id="d3">
<input maxlength="1" id="d4">
</div>

<button onclick="checkPin()">Jatka</button>

<div class="error" id="error"></div>

</div>

<script>

function checkPin(){

let pin =
document.getElementById("d1").value +
document.getElementById("d2").value +
document.getElementById("d3").value +
document.getElementById("d4").value;

if(pin === "1948"){

sessionStorage.setItem("allowed","true");
window.location.href="lomake.html";

}else{

document.getElementById("error").innerText="Väärä vuosiluku";

}

}

</script>

</body>
</html>
