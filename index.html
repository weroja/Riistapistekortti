<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lapinnevan Eränkävijät ry</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eef1f4;
      font-family: Arial, Helvetica, sans-serif;
      color: #111;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.14);
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    p {
      margin: 0 0 24px;
      color: #555;
      line-height: 1.4;
    }

    .pin {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .pin input {
      width: 62px;
      height: 72px;
      border: 2px solid #cfd6dd;
      border-radius: 12px;
      font-size: 30px;
      text-align: center;
      outline: none;
      transition: 0.15s ease;
    }

    .pin input:focus {
      border-color: #1f5f2c;
      box-shadow: 0 0 0 3px rgba(31, 95, 44, 0.12);
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 14px 18px;
      font-size: 16px;
      font-weight: bold;
      background: #1f5f2c;
      color: white;
      cursor: pointer;
      transition: 0.15s ease;
    }

    button:hover {
      background: #174a22;
    }

    .error {
      margin-top: 14px;
      min-height: 20px;
      color: #b00020;
      font-size: 15px;
    }

    .hint {
      margin-top: 14px;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Lapinnevan Eränkävijät ry</h1>
    <p>Anna seuran perustamisvuosi päästäksesi lomakkeelle.</p>

    <div class="pin">
      <input type="text" inputmode="numeric" maxlength="1" id="d1" autocomplete="off">
      <input type="text" inputmode="numeric" maxlength="1" id="d2" autocomplete="off">
      <input type="text" inputmode="numeric" maxlength="1" id="d3" autocomplete="off">
      <input type="text" inputmode="numeric" maxlength="1" id="d4" autocomplete="off">
    </div>

    <button onclick="checkPin()">Jatka</button>
    <div class="error" id="error"></div>
    <div class="hint">Syötä 4 numeroa</div>
  </div>

  <script>
    const inputs = document.querySelectorAll('.pin input');
    const correctPin = "1948";

    inputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        e.target.value = e.target.value.replace(/[^0-9]/g, '');

        if (e.target.value && index < inputs.length - 1) {
          inputs[index + 1].focus();
        }
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !input.value && index > 0) {
          inputs[index - 1].focus();
        }

        if (e.key === 'Enter') {
          checkPin();
        }
      });

      input.addEventListener('paste', (e) => {
        e.preventDefault();
        const pasted = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '').slice(0, 4);

        if (!pasted) return;

        pasted.split('').forEach((char, i) => {
          if (inputs[i]) inputs[i].value = char;
        });

        if (pasted.length < 4) {
          inputs[pasted.length].focus();
        } else {
          inputs[3].focus();
        }
      });
    });

    function checkPin() {
      const pin = Array.from(inputs).map(input => input.value).join('');
      const error = document.getElementById('error');

      if (pin === correctPin) {
        sessionStorage.setItem('allowed', 'true');
        window.location.href = 'lomake.html';
      } else {
        error.textContent = 'Väärä vuosiluku.';
        inputs.forEach(input => input.value = '');
        inputs[0].focus();
      }
    }

    inputs[0].focus();
  </script>
</body>
</html>
